name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'marketplace'
      - '**/*.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'marketplace'
      - '**/*.py'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # CPython 3.9 is the documented minimum (macOS system Python, pyright,
      # script conventions). actions/setup-python has no 3.9 build for
      # Ubuntu 26.04, which is what ubuntu-latest runs, so install it with uv.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: "false"

      - name: Setup minimum supported Python
        run: |
          set -euo pipefail
          uv python install 3.9
          py="$(uv python find 3.9)"
          "$py" -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 9) else 1)'
          bindir="$RUNNER_TEMP/python-bin"
          mkdir -p "$bindir"
          ln -sfn "$py" "$bindir/python"
          ln -sfn "$py" "$bindir/python3"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Check Python 3.9 syntax
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/trellis-pycache"
          git ls-files -z --recurse-submodules '*.py' | xargs -0 python -m py_compile

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      - name: Typecheck Python
        run: pnpm --filter @sfw003/trellis lint:py

      - name: Lint (core + cli)
        run: pnpm lint

      # Build before test: integration tests spawn the real CLI via
      # bin/trellis.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d packages/core/dist
          test -f packages/core/dist/index.js
          test -f packages/core/dist/channel/index.js
          test -f packages/core/dist/task/index.js
          test -d packages/cli/dist
          test -f packages/cli/dist/index.js
          echo "Build verification passed"
